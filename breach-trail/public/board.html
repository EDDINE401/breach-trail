<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0f12">
<title>ITC Breach Trail Leaderboard</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"JetBrains Mono";src:url(/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");font-weight:500 700}
@font-face{font-family:"JetBrains Mono";src:url(/fonts/jetbrains-mono-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Geist";src:url(/fonts/geist-latin-wght-normal.woff2) format("woff2");font-weight:400 600}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2");font-weight:400 700;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
:root{--ink:#0e0f12;--steel:#1b1e24;--lift:#171a20;--line:#2e323a;--grey:#8a8f98;--text:#f2f3f5;--red:#d81e24;--hot:#ff4d52;--ok:#3ddc84;
--mono:"JetBrains Mono","IBM Plex Sans Arabic",ui-monospace,Menlo,Consolas,monospace;--sans:"Geist","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
--glow:0 0 0 1px var(--hot),0 0 22px rgba(255,77,82,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:20px/1.4 var(--sans);height:100vh;padding:28px 36px;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:20px}
.brand{display:flex;gap:20px;align-items:center}
.mark{font:800 58px/1 var(--mono);letter-spacing:-.04em}.mark b{color:var(--hot)}
.tag{font:700 14px var(--mono);letter-spacing:.16em;color:var(--hot)}
h1{font:800 42px/1.05 var(--mono);margin:2px 0;letter-spacing:-.01em;text-transform:uppercase}
html[lang=ar] h1{text-transform:none;font-family:var(--sans)}
.sub{color:var(--grey);font-size:20px}
.stats{display:flex;gap:16px;align-items:center}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 22px;background:var(--lift);min-width:170px}
.stat.hot{border-color:var(--hot);box-shadow:var(--glow)}
.stat i{display:block;font:700 13px var(--mono);letter-spacing:.18em;color:var(--grey);font-style:normal}
.stat.hot i{color:var(--hot)}
.stat b{font:800 52px/1.1 var(--mono)}.stat.hot b{color:var(--hot)}
.lang{background:var(--steel);border:1px solid var(--line);color:var(--text);font:700 15px var(--mono);border-radius:20px;padding:8px 16px;cursor:pointer}
.live{font:700 12px var(--mono);letter-spacing:.1em;color:var(--grey);margin-top:6px}
.live::before{content:"";display:inline-block;width:9px;height:9px;background:var(--hot);margin-inline-end:8px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 440px;gap:22px}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--lift);overflow:hidden;display:flex;flex-direction:column;min-height:0}
table{width:100%;border-collapse:collapse}
th{font:700 13px var(--mono);letter-spacing:.14em;color:var(--grey);text-align:start;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:9px 16px;border-top:1px solid var(--line);font:700 28px var(--mono);white-space:nowrap}
td.op{font-size:30px;width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
tr:first-child td{border-top:0}
.rank{display:inline-grid;place-items:center;min-width:46px;height:46px;border-radius:10px;border:1px solid var(--line);font:700 22px var(--mono);color:var(--text);background:var(--steel)}
tr.top3 .rank{background:var(--hot);border-color:var(--hot);color:#fff}
tr.top3{background:linear-gradient(90deg,rgba(255,77,82,.08),transparent)}
.pts{font-size:34px}
.plus{color:var(--hot);font-size:15px;margin-inline-start:8px}
.dots{letter-spacing:.2em;font-size:24px}
.dots .o{color:var(--line)}
td.time{font:700 24px var(--mono);color:var(--grey);text-align:end}
th.time{text-align:end;font:700 13px var(--mono);color:var(--grey)}
.elite{display:inline-block;font:700 13px var(--mono);color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:2px 10px;margin-inline-start:12px;vertical-align:middle;letter-spacing:.08em}
.empty{color:var(--grey);font:20px var(--mono);padding:30px 16px}
.logh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font:800 18px var(--mono);letter-spacing:.08em}
.logh em{font:700 11px var(--mono);font-style:normal;color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:3px 10px}
#log{overflow:hidden;flex:1}
.ev{padding:11px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:600 17px/1.35 var(--mono)}
.ev:first-child{border-top:0}
.ev .k{font:700 11px var(--mono);letter-spacing:.1em;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--grey);align-self:center}
.ev .t{color:var(--grey);font-size:13px}
.ev .m{grid-column:1/-1}
.ev .m b{color:var(--hot)}
.ev.stamp .k,.ev.finish .k{border-color:var(--hot);color:var(--hot)}
.foot{padding:12px 18px;border-top:1px solid var(--line);color:var(--grey);font:14px var(--mono)}
.foot b{color:var(--hot)}
.mark .logo{height:64px;width:auto;display:block;fill:#F0281C}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="mark"><svg class="logo" viewBox="495 442 1049 861" role="img" aria-label="ITC"><path d="M738 450 926 590V637H738Z"/><path d="M503 872V792A107 107 0 0 1 610 685H1348L1536 872H926V1295H738V872Z"/><path d="M503 919H691V1295H610A107 107 0 0 1 503 1188Z"/><path d="M973 919H1161V1107H1536L1348 1295H1080A107 107 0 0 1 973 1188Z"/></svg></div>
    <div>
      <div class="tag" id="tag"></div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><i id="lPlayers"></i><b id="nPlayers">0</b></div>
    <div class="stat hot"><i id="lDone"></i><b id="nDone">0</b></div>
    <div><button class="lang" id="lang" type="button"></button><div class="live" id="live"></div></div>
  </div>
</div>
<div class="main">
  <div class="panel">
    <table>
      <thead><tr><th>#</th><th id="hOp"></th><th id="hPts"></th><th id="hLv"></th><th id="hSt"></th><th class="time" id="hTime"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div class="panel">
    <div class="logh"><span id="logT"></span><em id="liveTag"></em></div>
    <div id="log"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/board.js"></script>
</body>
</html>
